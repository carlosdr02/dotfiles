##### Key bindings (Alt = Meta) #####
# Note: Most terminals send Alt as "Meta". If your Alt bindings don't work,
# you may need to enable "Use Option as Meta" (macOS Terminal/iTerm2).

set -g base-index 1
set -g pane-base-index 1

# Alt + Enter -> new window
bind-key -n M-Enter new-window

# Alt + W -> kill current window
bind-key -n M-w kill-window

# Alt + E -> session selector (same as prefix + s)
bind-key -n M-e choose-session

# Alt + Tab -> next window (wraps by default)
bind-key -n M-Tab next-window

# Alt + Shift + Tab -> previous window (wraps by default)
# Many terminals send "Backtab" for Shift+Tab.
bind-key -n M-BTab previous-window
bind-key -n M-S-Tab previous-window

# Alt + : -> command prompt (command mode)
bind-key -n M-: command-prompt


##### 24-bit color (truecolor) #####
# Modern tmux:
set -g default-terminal "tmux-256color"

# Advertise truecolor to applications
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"

# If you're on an older tmux (< 3.2), you can use this instead of terminal-features:
# set -ga terminal-overrides ",*:Tc"

# Alt + number -> select window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10
